# HorneroOS extension capability inventory.
# Researched entries describe competitive capabilities studied for
# inspiration (see HorneroOS/docs competitive-capability-matrix.md);
# no upstream code is copied. Implemented entries are plugins in
# this repository under plugins/.
#
# Provenance (HorneroOS/plugins#33): every entry carries the
# upstream link (origin.url), classification, license status and
# inspiration notes, enforced by scripts/validate_plugins.py.
# license_status verified requires license_evidence: for upstream
# entries the https URL of the license file a maintainer observed
# (recorded 2026-11-13 for the entries present at schema 2), and
# for first-party entries the plugin's own LICENSE path, which the
# validator probes together with the manifest license. Anything not
# verified from the upstream source must read license: UNVERIFIED
# with license_status: unverified; never claim a license silently.

schemaVersion: 2
