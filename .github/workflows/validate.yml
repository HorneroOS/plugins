name: validate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  plugins:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate plugin payloads
        run: python3 scripts/validate_plugins.py
      - name: Catalog is fresh
        run: python3 scripts/gen_catalog.py --check
