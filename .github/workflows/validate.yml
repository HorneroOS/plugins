name: validate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  plugins:
    runs-on: ubuntu-latest
    steps:
      # gen_catalog.py resolves generatedFrom from git history;
      # a shallow (default depth-1) checkout makes that answer
      # depend on the synthetic PR merge commit and breaks --check.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate plugin payloads
        run: python3 scripts/validate_plugins.py
      - name: Catalog is fresh
        run: python3 scripts/gen_catalog.py --check
