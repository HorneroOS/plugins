name: validate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  plugins:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # gen_catalog.py resolves generatedFrom from git history;
      # a shallow (default depth-1) checkout makes that answer
      # depend on the synthetic PR merge commit and breaks --check.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
      - name: Validate plugin payloads
        run: python3 scripts/validate_plugins.py
      - name: Catalog is fresh
        run: python3 scripts/gen_catalog.py --check
      - name: Changed payloads bump their version
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git fetch --no-tags origin "$BASE_REF"
          python3 scripts/check_version_bumps.py --base "origin/$BASE_REF"
      # The shell validator is the canonical PluginKit contract. Every
      # package must be schemaVersion 3 and pass it unchanged. The shell revision
      # is pinned and bumped together with the catalogue.
      - name: Check out the pinned shell (validator only)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          repository: HorneroOS/shell
          ref: 605ace17db6ce8d3e02756dc11327a9402395950
          path: .shell
          sparse-checkout: |
            scripts
            schemas
            assets/fonts
      - name: Shell validator accepts every PluginKit 3 package
        run: python3 scripts/shell_parity.py .shell
      - name: Install minisign for isolated signature tests
        run: sudo apt-get update && sudo apt-get install --yes minisign
      - name: Community registry schema and signature tests
        run: python3 -m unittest discover -s tests -v
